name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------------
  # 1. Native CMake build — GCC strict C89
  # -------------------------------------------------------------------------
  cmake-gcc:
    name: CMake / GCC / C89 strict
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure (strict warnings)
        run: |
          cmake -S . -B build/gcc \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc \
            -DCMAKE_C_FLAGS="-std=c89 -pedantic -Wall -Wextra -Werror \
              -Wshadow -Wconversion -Wundef -Wcast-qual" \
            -DOSTX_BUILD_EXAMPLES=ON \
            -DOSTX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/gcc --parallel

      - name: Run test vectors
        run: ctest --test-dir build/gcc --output-on-failure

  # -------------------------------------------------------------------------
  # 2. Native CMake build — Clang
  # -------------------------------------------------------------------------
  cmake-clang:
    name: CMake / Clang / C89 strict
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get install -y clang

      - name: Configure
        run: |
          cmake -S . -B build/clang \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_C_FLAGS="-std=c89 -pedantic -Wall -Wextra -Werror" \
            -DOSTX_BUILD_EXAMPLES=ON \
            -DOSTX_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build/clang --parallel

      - name: Run test vectors
        run: ctest --test-dir build/clang --output-on-failure

  # -------------------------------------------------------------------------
  # 3. Custom config tiers — ensure Ultra/Tight still compile cleanly
  # -------------------------------------------------------------------------
  cmake-tiers:
    name: CMake / Config tiers
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        tier:
          - name: Ultra
            flags: "-DOSTX_PACKET_MAX=32 -DOSTX_BODY_MAX=14 -DOSTX_ID_MAX=3 -DOSTX_UNIT_MAX=4 -DOSTX_B62_MAX=7 -DOSTX_VALUE_SCALE=100L"
          - name: Tight
            flags: "-DOSTX_PACKET_MAX=48 -DOSTX_BODY_MAX=24 -DOSTX_ID_MAX=5 -DOSTX_UNIT_MAX=5 -DOSTX_B62_MAX=8 -DOSTX_VALUE_SCALE=1000L"
          - name: Comfort
            flags: "-DOSTX_PACKET_MAX=128 -DOSTX_BODY_MAX=96 -DOSTX_ID_MAX=12 -DOSTX_UNIT_MAX=12 -DOSTX_B62_MAX=14 -DOSTX_VALUE_SCALE=10000L"
    steps:
      - uses: actions/checkout@v4

      - name: Configure (${{ matrix.tier.name }})
        run: |
          cmake -S . -B build/tier \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-std=c89 -pedantic -Wall -Wextra -Werror ${{ matrix.tier.flags }}" \
            -DOSTX_BUILD_EXAMPLES=ON

      - name: Build (${{ matrix.tier.name }})
        run: cmake --build build/tier --parallel

  # -------------------------------------------------------------------------
  # 4. Arduino library structure — compile BasicTX for arduino:avr:uno
  # -------------------------------------------------------------------------
  arduino-compile:
    name: Arduino / arduino:avr:uno
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh

      - name: Update board index
        run: arduino-cli core update-index

      - name: Install AVR core
        run: arduino-cli core install arduino:avr

      - name: Install library (symlink)
        run: |
          mkdir -p ~/Arduino/libraries
          ln -s "$GITHUB_WORKSPACE" ~/Arduino/libraries/OSynaptic-TX

      - name: Compile BasicTX (Uno)
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            --warnings all \
            examples/BasicTX

      - name: Compile MultiSensorTX (Uno)
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            examples/MultiSensorTX

      - name: Compile BareMetalUARTTX (Uno)
        run: |
          arduino-cli compile \
            --fqbn arduino:avr:uno \
            examples/BareMetalUARTTX

  # -------------------------------------------------------------------------
  # 5. arduino-lint — library spec compliance check
  # -------------------------------------------------------------------------
  arduino-lint:
    name: Arduino Lint
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/arduino-lint-action@v1
        with:
          library-manager: false
          compliance: strict
